[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecompress"
version = "0.1.0"
description = "Compress voice recordings by 80-95% using ffmpeg, with speech-tuned presets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["audio", "compression", "voice", "ffmpeg", "opus", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.optional-dependencies]
progress = ["tqdm"]
dev = ["pytest", "ruff", "tqdm"]

[project.scripts]
voicecompress = "voicecompress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
